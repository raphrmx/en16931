name: en16931
description: >-
  The European electronic invoice, EN 16931, as Dart objects. Builds and checks
  the semantic model the UBL and CII syntaxes both carry, with no XML and no
  network of its own.
version: 0.1.5
homepage: https://packages.comapps.be/#en16931
repository: https://github.com/raphrmx/en16931
issue_tracker: https://github.com/raphrmx/en16931/issues
funding:
  - https://www.paypal.com/donate/?hosted_button_id=ZN6D382YQAV5N
topics:
  - einvoicing
  - en16931
  - peppol
  - invoice
  - vat
screenshots:
  - description: Which packages to add for a Peppol, UBL.BE, XRechnung or Factur-X invoice, and what each one writes.
    path: screenshots/situations.png

environment:
  sdk: ^3.3.0

dependencies:
  decimal: ^3.2.6

dev_dependencies:
  lint: ^2.4.0
  test: ^1.25.7
  xml: ^7.1.0
